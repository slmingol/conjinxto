version: '3.8'

services:
  conjinxto-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conjinxto
    restart: unless-stopped
    ports:
      - "3199:80"
    environment:
      - NODE_ENV=production
    networks:
      - conjinxto-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.conjinxto.description=Conjinxto Word Game"
      - "com.conjinxto.version=1.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  conjinxto-network:
    driver: bridge
    name: conjinxto-network
