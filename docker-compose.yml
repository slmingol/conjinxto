version: '3.8'

services:
  contexto-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contexto-clone
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
    networks:
      - contexto-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.contexto.description=Contexto Clone Game"
      - "com.contexto.version=1.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  contexto-network:
    driver: bridge
    name: contexto-network
