version: '3.8'

services:
  contexto-dev:
    image: node:20-alpine
    container_name: contexto-clone-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true

