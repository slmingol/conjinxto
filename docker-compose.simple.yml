version: '3.8'

services:
  conjinxto-dev:
    image: node:20-alpine
    container_name: conjinxto-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3199:3199"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3199"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true

